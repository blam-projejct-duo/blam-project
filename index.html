<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F1ED" />
  <meta name="description" content="Blam — radar konservasi pesisir dan hutan Indonesia." />
  <meta name="application-name" content="Blam" />
  <meta property="og:site_name" content="Blam" />
  <meta property="og:title" content="Blam — Radar Konservasi" />
  <meta property="og:description" content="Blam — radar konservasi pesisir dan hutan Indonesia." />
  <title>Blam — Radar Konservasi</title>
  <style>
    html,
    body {
      margin: 0;
      background: #F3F1ED;
    }

    /* ===== Splash Blam: maskot gajah beranimasi (SVG inline, tanpa file gambar) ===== */
    #splash {
      --sp-ink: #12286b;
      --sp-muted: #5b6478;
      --sp-blue: #38bdf8;
      --sp-deep: #2563eb;
      --sp-green: #22c55e;
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
      overflow: hidden;
      background: #F3F1ED;
      color: var(--sp-ink);
      font-family: 'DM Sans Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .45s ease, transform .45s ease;
    }

    #splash.sp-hide {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    #splash .sp-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      animation: sp-breathe 5s ease-in-out infinite alternate;
    }

    #splash .sp-blob.a {
      width: 76vmin;
      height: 76vmin;
      top: 2%;
      left: -20%;
      background: radial-gradient(circle, rgba(56, 189, 248, .3), transparent 68%);
    }

    #splash .sp-blob.b {
      width: 70vmin;
      height: 70vmin;
      bottom: 0;
      right: -18%;
      background: radial-gradient(circle, rgba(34, 197, 94, .26), transparent 68%);
      animation-delay: -2.5s;
    }

    #splash svg.sp-scene {
      position: relative;
      width: min(88vw, 400px);
      height: auto;
      aspect-ratio: 1;
      overflow: visible;
    }

    /* semua transform di SVG memakai satuan viewBox (1024) */
    #splash .sp-scene * {
      transform-box: view-box;
    }

    #splash .sp-scene .fb {
      transform-box: fill-box;
    }

    /* orbit */
    #splash .sp-orbit {
      transform-origin: 512px 540px;
      animation: sp-fade .8s ease .2s both, sp-rot 12s linear infinite;
    }

    /* cincin radar */
    #splash .sp-ping {
      fill: none;
      stroke-width: 6;
      transform-origin: 540px 540px;
      opacity: 0;
      animation: sp-ping 2.8s ease-out 1.1s infinite;
    }

    #splash .sp-ping.b {
      animation-delay: 2.5s;
    }

    #splash .sp-ground {
      transform-origin: 540px 960px;
      opacity: .2;
      animation: sp-ground 1.8s ease-in-out 1.1s infinite;
    }

    /* masuk: pop membal, lalu lompat-lompat kecil */
    #splash .sp-intro {
      transform-origin: 512px 900px;
      animation: sp-pop-in 1s cubic-bezier(.3, 1.5, .5, 1) both;
    }

    #splash .sp-bob {
      transform-origin: 512px 900px;
      animation: sp-bob 1.8s ease-in-out 1.1s infinite;
    }

    /* bagian-bagian maskot */
    #splash .sp-land {
      animation: sp-drift 4.5s ease-in-out infinite alternate;
    }

    #splash .sp-sweep {
      transform-origin: 540px 540px;
      animation: sp-rot 3s linear infinite;
    }

    #splash .sp-ear {
      transform-origin: 365px 260px;
      animation: sp-flap 1.9s ease-in-out 1.2s infinite alternate;
    }

    #splash .sp-tleaf {
      transform-origin: 835px 235px;
      animation: sp-wag 1.3s ease-in-out 1s infinite alternate;
    }

    #splash .sp-leafb {
      transform-origin: 200px 625px;
      animation: sp-sway 2.6s ease-in-out infinite alternate;
    }

    #splash .sp-eye {
      transform-origin: 525px 260px;
      animation: sp-blink 3.2s ease-in-out 1.5s infinite;
    }

    #splash .sp-brow {
      animation: sp-brow 3.2s ease-in-out 1.5s infinite;
    }

    #splash .sp-tip {
      transform-origin: 397px 695px;
      animation: sp-tip 1.4s ease-in-out infinite;
    }

    #splash .sp-tip.t2 {
      transform-origin: 431px 686px;
      animation-delay: .35s;
    }

    /* pin titik rawan: merah lalu hijau (tertangani) */
    #splash .sp-pin {
      transform-origin: 50% 100%;
      transform: scale(0);
      animation: sp-pin 4s ease-in-out var(--d) infinite;
    }

    /* daun & kilau */
    #splash .sp-fly {
      opacity: 0;
      transform-origin: 50% 50%;
      animation: sp-fly var(--t, 4s) ease-in-out var(--d) infinite;
    }

    #splash .sp-spark {
      opacity: 0;
      transform-origin: 50% 50%;
      animation: sp-twinkle 2.2s ease-in-out var(--d) infinite;
    }

    /* wordmark */
    #splash h1 {
      display: flex;
      margin: 6px 0 0;
      font-family: 'Bricolage Grotesque Variable', 'DM Sans Variable', system-ui, sans-serif;
      font-size: 46px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--sp-ink);
    }

    #splash h1 span {
      display: inline-block;
      animation:
        sp-letter .6s cubic-bezier(.3, 1.7, .5, 1) calc(.8s + var(--i) * .09s) both,
        sp-wave 1.7s ease-in-out calc(1.7s + var(--i) * .12s) infinite;
    }

    #splash .sp-msg {
      margin-top: 14px;
      min-height: 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--sp-muted);
      animation: sp-fade .5s ease 1.2s both;
    }

    #splash .sp-msg.swap {
      animation: sp-swap .4s ease both;
    }

    /* bar loading */
    #splash .sp-bar {
      position: relative;
      width: 150px;
      height: 6px;
      margin-top: 14px;
      border-radius: 99px;
      background: rgba(18, 40, 107, .1);
      overflow: hidden;
      animation: sp-fade .5s ease 1.3s both;
    }

    #splash .sp-bar i {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--sp-blue), var(--sp-deep), var(--sp-green));
      animation: sp-slide 1.3s cubic-bezier(.6, 0, .4, 1) infinite;
    }

    #splash nav {
      position: absolute;
      bottom: calc(18px + env(safe-area-inset-bottom));
      font-size: 12px;
      color: var(--sp-muted);
    }

    #splash nav a {
      color: inherit;
      text-decoration: none;
      padding: 4px 6px;
    }

    #splash nav a:hover,
    #splash nav a:focus-visible {
      color: var(--sp-ink);
      text-decoration: underline;
      outline: none;
    }

    @keyframes sp-breathe {
      from {
        transform: scale(.92) translate(0, 0);
      }

      to {
        transform: scale(1.08) translate(10px, -8px);
      }
    }

    @keyframes sp-pop-in {
      0% {
        opacity: 0;
        transform: translateY(-260px) scale(.5) rotate(-14deg);
      }

      35% {
        opacity: 1;
      }

      60% {
        transform: translateY(0) scale(1.1, .9) rotate(3deg);
      }

      80% {
        transform: translateY(-30px) scale(.97, 1.04) rotate(-2deg);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }

    @keyframes sp-bob {

      0%,
      100% {
        transform: translateY(0) scale(1.03, .97);
      }

      20% {
        transform: translateY(-14px) scale(.99, 1.02) rotate(-1.5deg);
      }

      50% {
        transform: translateY(-40px) scale(1) rotate(1.5deg);
      }

      80% {
        transform: translateY(-10px) scale(.99, 1.02) rotate(-1deg);
      }
    }

    @keyframes sp-ground {

      0%,
      100% {
        transform: scale(1);
        opacity: .22;
      }

      50% {
        transform: scale(.7);
        opacity: .1;
      }
    }

    @keyframes sp-ping {
      0% {
        transform: scale(1);
        opacity: .5;
      }

      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    @keyframes sp-rot {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sp-drift {
      from {
        transform: translateX(-26px);
      }

      to {
        transform: translateX(26px);
      }
    }

    @keyframes sp-flap {
      from {
        transform: rotate(-8deg);
      }

      to {
        transform: rotate(6deg);
      }
    }

    @keyframes sp-wag {
      from {
        transform: rotate(-12deg);
      }

      to {
        transform: rotate(10deg);
      }
    }

    @keyframes sp-sway {
      from {
        transform: rotate(-3deg);
      }

      to {
        transform: rotate(3deg);
      }
    }

    @keyframes sp-blink {

      0%,
      90%,
      100% {
        transform: scaleY(1);
      }

      94% {
        transform: scaleY(.08);
      }
    }

    @keyframes sp-brow {

      0%,
      88%,
      100% {
        transform: translateY(0);
      }

      94% {
        transform: translateY(-9px);
      }
    }

    @keyframes sp-tip {

      0%,
      100% {
        transform: scale(1);
        opacity: .9;
      }

      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }

    @keyframes sp-pin {

      0%,
      6% {
        transform: scale(0);
        fill: #ef4444;
      }

      14% {
        transform: scale(1.25);
        fill: #ef4444;
      }

      20%,
      50% {
        transform: scale(1);
        fill: #ef4444;
      }

      58% {
        transform: scale(1.2);
        fill: #10b981;
      }

      66%,
      88% {
        transform: scale(1);
        fill: #10b981;
      }

      100% {
        transform: scale(0);
        fill: #10b981;
      }
    }

    @keyframes sp-fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0) scale(.5);
      }

      15% {
        opacity: 1;
      }

      50% {
        transform: translate(calc(var(--dx) * .4), -260px) rotate(calc(var(--r) * .5)) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(var(--dx), -560px) rotate(var(--r)) scale(.9);
      }
    }

    @keyframes sp-twinkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(.2) rotate(0);
      }

      50% {
        opacity: 1;
        transform: scale(1) rotate(45deg);
      }
    }

    @keyframes sp-letter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.6);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sp-wave {

      0%,
      55%,
      100% {
        transform: translateY(0);
      }

      25% {
        transform: translateY(-8px);
      }
    }

    @keyframes sp-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes sp-swap {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sp-slide {
      from {
        left: -50%;
      }

      to {
        left: 105%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash * {
        animation: none !important;
      }

      #splash .sp-intro {
        opacity: 1;
      }

      #splash .sp-pin {
        transform: scale(1);
        fill: #10b981;
      }

      #splash .sp-fly,
      #splash .sp-spark,
      #splash .sp-ping {
        display: none;
      }

      #splash .sp-bar i {
        left: 0;
        width: 100%;
      }
    }
  </style>
  <noscript>
    <style>
      #splash {
        display: none !important;
      }
    </style>
  </noscript>
</head>

<body>
  <div id="root"></div>

  <!-- Splash: di luar #root supaya tidak ikut terganti saat React mulai render; dihapus lewat main.tsx -->
  <div id="splash" role="status" aria-label="Memuat Blam">
    <div class="sp-blob a"></div>
    <div class="sp-blob b"></div>

    <svg class="sp-scene" viewBox="0 0 1024 1024" aria-hidden="true">

      <g class="sp-orbit">

        <circle cx="982" cy="540" r="15" fill="#38bdf8" />

      <!-- radar ping & bayangan -->
      <circle class="sp-ping" cx="540" cy="540" r="348" stroke="#2563eb" />

      <ellipse class="sp-ground" cx="540" cy="965" rx="230" ry="22" fill="#12286b" />

      <!-- daun terbang -->
      <g transform="translate(250 760)">

      </g>
      <g transform="translate(640 820)">
        <path class="sp-fly" style="--dx:60px;--r:-70deg;--d:3.8s;--t:4.2s" d="M4 66C0 32 12 8 44 0 46 34 32 58 4 66Z"

      <!-- pin titik rawan -->
      <g transform="translate(960 650)">

              stroke-linecap="round" opacity=".8" />

        </g>
      </g>

      <!-- kilau -->
      <g transform="translate(170 110)">
        <path class="sp-spark fb" style="--d:1.4s" d="M0-30 8-8 30 0 8 8 0 30-8 8-30 0-8-8Z" fill="#38bdf8" />

      <g transform="translate(960 420)">

  <script>
    (function () {
      var s = document.getElementById('splash');
      if (!s) return;
      var seen = false;
      try { seen = sessionStorage.getItem('sp-seen') === '1'; } catch (e) { }
      var t0 = Date.now();
      var MIN = seen ? 0 : 2600; // kunjungan pertama: minimal 2,6 dtk supaya animasi masuk sempat terlihat
      window.__hideSplash = function () {
        if (window.__splashGone) return;
        window.__splashGone = true;
        setTimeout(function () {
          s.classList.add('sp-hide');
          try { sessionStorage.setItem('sp-seen', '1'); } catch (e) { }
          setTimeout(function () { s.remove(); }, 500);
        }, Math.max(0, MIN - (Date.now() - t0)));
      };
      setTimeout(window.__hideSplash, 6000); // pengaman: splash tidak boleh menutup layar selamanya

      var msgs = ['Gajah lagi pemanasan…', 'Memindai hutan & pesisir…', 'Menyiram bibit mangrove…', 'Menandai titik rawan…', 'Hampir siap!'];
      var i = 0, el = document.getElementById('sp-msg');
      setInterval(function () {
        i = (i + 1) % msgs.length;
        if (!el) return;
        el.classList.remove('swap');
        void el.offsetWidth; // restart animasi
        el.textContent = msgs[i];
        el.classList.add('swap');
      }, 1300);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
